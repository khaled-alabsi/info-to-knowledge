name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # The case files that need no model host and no downloaded model. The cases that need Apple's text recognizer or
    # MLX skip themselves on Linux. The integration suite and the browser tests run on a contributor's machine.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu pandoc
      - name: Python packages and the i2k command
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Offline program tests
        run: python tests/run_tests.py
      - name: Web page unit tests
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Web page build
        working-directory: web
        run: npm run build
