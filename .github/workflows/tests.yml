name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # The case files that need no model host and no downloaded model. The integration suite and the browser tests run
    # on a contributor's machine. A Mac with an Apple chip, as the program is built on: Tesseract reads the tests'
    # rendered slides a few words differently on an Intel processor, with the same version and language data.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: System tools
        # Homebrew's Tesseract comes with English only; German is in tesseract-lang
        run: |
          brew install ffmpeg tesseract tesseract-lang pandoc
          tesseract --version
      - name: Python packages and the i2k command
        # In .venv at the root, as on a contributor's machine: the frame classifier's launcher runs that environment.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          .venv/bin/python -m pip install --no-deps -e .
      - name: Offline program tests
        run: .venv/bin/python tests/run_tests.py
      - name: Web page unit tests
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Web page build
        working-directory: web
        run: npm run build
