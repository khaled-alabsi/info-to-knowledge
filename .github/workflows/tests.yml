name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # The case files that need no model host and no downloaded model. The cases that need Apple's text recognizer or
    # MLX skip themselves on Linux. The integration suite and the browser tests run on a contributor's machine.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu pandoc
      - name: The text reader's fast language data, as Homebrew ships it
        # Ubuntu's language packages are the larger standard data, which read the tests' rendered slides differently
        run: |
          mkdir -p "$RUNNER_TEMP/tessdata"
          for language in eng deu osd; do
            curl -sSfL -o "$RUNNER_TEMP/tessdata/$language.traineddata" \
              "https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/$language.traineddata"
          done
          echo "TESSDATA_PREFIX=$RUNNER_TEMP/tessdata" >> "$GITHUB_ENV"
      - name: Python packages and the i2k command
        # In .venv at the root, as on a contributor's machine: the frame classifier's launcher runs that environment.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          .venv/bin/python -m pip install --no-deps -e .
      - name: Offline program tests
        run: .venv/bin/python tests/run_tests.py
      - name: Web page unit tests
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Web page build
        working-directory: web
        run: npm run build
